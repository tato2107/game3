<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Baker: Cookie Clicker Edition</title>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at center, #2d1808 0%, #0e0702 100%);
            --panel-bg: rgba(20, 10, 5, 0.85);
            --panel-border: #7c4d25;
            --text-gold: #fde047;
            --text-dim: #d4a373;
            --accent-orange: #f97316;
            --btn-gold: linear-gradient(180deg, #ffe066 0%, #d48806 50%, #8c5200 100%);
            --btn-hover: linear-gradient(180deg, #fff099 0%, #e69d12 50%, #a66200 100%);
            --shadow-glow: 0 0 15px rgba(249, 115, 22, 0.4);
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: var(--bg-gradient);
            color: #fef08a;
            margin: 0;
            padding: 15px;
            display: flex;
            height: 100vh;
            box-sizing: border-box;
            gap: 15px;
            overflow: hidden;
            user-select: none;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1a0c03; }
        ::-webkit-scrollbar-thumb { background: #7c4d25; border-radius: 4px; }

        .column {
            background: var(--panel-bg);
            border: 3px solid var(--panel-border);
            border-radius: 12px;
            padding: 15px;
            overflow-y: auto;
            box-shadow: inset 0 0 15px #000, 0 10px 25px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(5px);
        }

        #left-col { flex: 1.2; text-align: center; align-items: center; justify-content: space-between; position: relative; }
        #mid-col { flex: 1.6; }
        #right-col { flex: 1.4; }

        h1, h2, h3 { 
            color: var(--text-gold); 
            margin-top: 0; 
            text-shadow: 2px 2px 4px #000, 0 0 10px rgba(253, 224, 71, 0.5);
            font-family: 'Trebuchet MS', sans-serif;
            letter-spacing: 1px;
        }

        #quanta-container {
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid var(--panel-border);
            padding: 12px;
            border-radius: 10px;
            width: 100%;
            box-sizing: border-box;
            box-shadow: inset 0 0 10px #000;
        }
        #quanta-display { 
            font-size: 2.6rem; 
            font-weight: 900; 
            color: #fff; 
            text-shadow: 0 0 12px var(--accent-orange), 2px 2px 2px #000;
            margin: 5px 0;
        }
        #cps-display { font-size: 1.1rem; color: var(--text-dim); }

        /* Cookie Button Visuals */
        .clicker-btn-container { position: relative; display: flex; justify-content: center; align-items: center; }
        
        .clicker-btn {
            background: radial-gradient(circle at 30% 30%, #f59e0b 0%, #b45309 60%, #451a03 100%);
            border: 6px solid #fde047;
            border-radius: 50%;
            width: 220px;
            height: 220px;
            font-size: 1.8rem;
            font-weight: 900;
            color: #fff;
            cursor: pointer;
            box-shadow: 0 0 40px rgba(245, 158, 11, 0.6), inset 0 0 20px rgba(255, 255, 255, 0.3);
            transition: transform 0.05s, box-shadow 0.05s;
            text-shadow: 2px 2px 6px #000;
            position: relative;
        }
        .clicker-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 20px var(--accent-orange);
        }

        /* Floating Click Numbers Animation */
        .click-float {
            position: absolute;
            color: #fff;
            font-size: 1.5rem;
            font-weight: bold;
            text-shadow: 0 0 8px var(--accent-orange), 2px 2px 2px #000;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-60px) scale(1.2); }
        }

        /* Item Cards with Icons */
        .item-card {
            background: linear-gradient(135deg, #2b1609 0%, #170b04 100%);
            border: 2px solid var(--panel-border);
            padding: 10px 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            transition: border-color 0.2s, transform 0.1s;
        }
        .item-card:hover { 
            border-color: var(--text-gold); 
            transform: translateX(3px);
        }

        .item-icon {
            font-size: 2rem;
            margin-right: 12px;
            min-width: 40px;
            text-align: center;
            filter: drop-shadow(0 0 4px rgba(253, 224, 71, 0.4));
        }

        button.action-btn {
            background: var(--btn-gold);
            color: #261202;
            border: 1px solid #fff;
            padding: 8px 14px;
            font-weight: bold;
            font-size: 0.95rem;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
            text-shadow: 0 1px 0 rgba(255,255,255,0.4);
        }
        button.action-btn:hover { background: var(--btn-hover); }
        button:disabled { 
            background: #2d1808 !important; 
            border-color: #451a03 !important; 
            color: #78350f !important; 
            cursor: not-allowed; 
            box-shadow: none; 
            text-shadow: none;
        }

        .tab-bar { display: flex; gap: 6px; margin-bottom: 12px; }
        .tab-btn { 
            flex: 1; 
            padding: 10px; 
            background: #1e0e05; 
            color: var(--text-dim); 
            border: 2px solid var(--panel-border); 
            cursor: pointer; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 0.9rem; 
        }
        .tab-btn.active { 
            background: var(--btn-gold); 
            color: #0e0702; 
            border-color: #fff; 
        }
        .tab-pane { display: none; flex: 1; overflow-y: auto; }
        .tab-pane.active { display: flex; flex-direction: column; }

        .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--panel-border); }
        .stat-label { color: var(--text-dim); }
        .stat-value { font-weight: bold; color: var(--text-gold); }
    </style>
</head>
<body>

    <!-- LEFT COLUMN -->
    <div class="column" id="left-col">
        <div id="quanta-container">
            <h2>Quantum Bakery</h2>
            <div id="quanta-display">0</div>
            <div id="cps-display">per second: 0.0</div>
        </div>
        
        <div class="clicker-btn-container" id="btn-container">
            <button class="clicker-btn" onclick="clickQuanta(event)">BAKE</button>
        </div>

        <div style="width: 100%;">
            <button class="action-btn" onclick="ascend()" style="background: linear-gradient(180deg, #ef4444 0%, #991b1b 100%); border-color: #f87171; color: #fff; width: 100%; padding: 12px; font-size: 1rem; text-shadow: 0 2px 2px #000;">Ascend (Legacy Reset)</button>
            <p style="font-size: 0.85rem; color: var(--text-dim); margin: 8px 0 0 0;">Legacy Chips: <span id="chips-display" style="color:var(--text-gold); font-weight:bold;">0</span> (+<span id="chips-pending">0</span>)</p>
        </div>
    </div>

    <!-- MIDDLE COLUMN -->
    <div class="column" id="mid-col">
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('mid', 'buildings-pane')">Buildings (50)</button>
            <button class="tab-btn" onclick="switchTab('mid', 'minigames-pane')">Mini-Games</button>
        </div>

        <div id="buildings-pane" class="tab-pane active">
            <div id="buildings-container"></div>
        </div>

        <div id="minigames-pane" class="tab-pane">
            <h3>Quantum Grid Overclock</h3>
            <p style="color: var(--text-dim); font-size: 0.9rem;">Stabilize the flux core to grant instant production surges.</p>
            <div style="background: rgba(0,0,0,0.4); border: 2px dashed var(--panel-border); padding: 20px; border-radius: 8px; text-align: center; margin-top: 10px;">
                <div id="mg-status" style="font-size: 1.2rem; font-weight: bold; margin-bottom: 12px; color: #4ade80;">Core Stable</div>
                <button class="action-btn" id="mg-btn" onclick="triggerOverclock()">Overclock Core</button>
            </div>
        </div>
    </div>

    <!-- RIGHT COLUMN -->
    <div class="column" id="right-col">
        <div class="tab-bar">
            <button class="tab-btn active" onclick="switchTab('right', 'upgrades-pane')">Upgrades</button>
            <button class="tab-btn" onclick="switchTab('right', 'achievements-pane')">Milestones</button>
            <button class="tab-btn" onclick="switchTab('right', 'stats-pane')">Stats</button>
        </div>

        <div id="upgrades-pane" class="tab-pane active">
            <div style="margin-bottom: 8px; font-size: 0.85rem; color: var(--text-dim);">Available Upgrades:</div>
            <div id="upgrades-container"></div>
        </div>

        <div id="achievements-pane" class="tab-pane">
            <div id="achievements-container"></div>
        </div>

        <div id="stats-pane" class="tab-pane">
            <h3>Bakery Statistics</h3>
            <div id="stats-container"></div>
        </div>
    </div>

    <script>
        let game = {
            quanta: 0,
            totalEarned: 0,
            totalClicks: 0,
            timePlayed: 0,
            cps: 0,
            cpc: 1,
            chips: 0,
            buildings: [],
            upgrades: [],
            achievements: []
        };

        // Unique icons for all 50 building tiers
        const icons = [
            "👆", "👵", "🌱", "⛏️", "🏭", "🏦", "🏛️", "🧙‍♂️", "🚀", "🧪",
            "🌀", "⏳", "⚛️", "💎", "🎲", "🌀", "💻", "🌌", "🧠", "💡",
            "🕳️", "🔥", "🔗", "⭐", "🔮", "📜", "🌑", "🪐", "🌟", "🔩",
            "🛰️", "🕳️", "🕸️", "🏰", "⚓", "⚡", "⏳", "🌌", "📐", "🎨",
            "⚛️", "💥", "🌐", "✨", "👑", "📜", "🔨", "🔱", "♾️", "☀️"
        ];

        const buildingNames = [
            "Cursor", "Grandma", "Farm", "Mine", "Factory", 
            "Bank", "Temple", "Wizard Tower", "Shipment", "Alchemy Lab", 
            "Portal", "Time Machine", "Antimatter Condenser", "Prism", "Chancemaker",
            "Fractal Engine", "Javascript Console", "Idleverse", "Cortex Baker", "Eureka Station",
            "Void Synthesizer", "Singularity Forge", "Hyper Nexus", "Stellar Matrix", "Omega Core",
            "Chronos Loom", "Dark Matter Press", "Nebula Foundry", "Supermassive Rig", "Quark Compressor",
            "Tachyon Harvester", "Event Horizon", "Cosmic Weaver", "Infinity Spire", "Zero-Point Anchor",
            "Aether Reactor", "Entropy Reverser", "Multiverse Engine", "Dimension Fold", "Reality Shaper",
            "God Particle Press", "Big Bang Generator", "Omniverse Hub", "Transcendent Core", "Absolute Prism",
            "Eternity Loom", "Genesis Forge", "Alpha Nexus", "Omega Singularity", "The First Source"
        ];

        // 50 Buildings with exponential Cookie Clicker style cost progression
        for (let i = 0; i < 50; i++) {
            let baseCost = Math.floor(15 * Math.pow(3.75, i / 1.15));
            let baseCps = Math.floor(0.2 * Math.pow(2.4, i));
            game.buildings.push({
                id: i,
                name: buildingNames[i],
                icon: icons[i],
                cost: baseCost,
                baseCost: baseCost,
                cps: baseCps,
                owned: 0
            });
        }

        // Generate Upgrades
        for (let i = 0; i < 5000; i++) {
            let targetBuilding = i % 50;
            let tier = Math.floor(i / 50) + 1;
            game.upgrades.push({
                id: i,
                name: `${game.buildings[targetBuilding].name} Upgrade v${tier}.${i % 10}`,
                cost: Math.floor(100 * Math.pow(1.22, i / 25)),
                target: targetBuilding,
                bought: false,
                unlocked: i < 50
            });
        }

        // Achievements
        for (let i = 0; i < 50; i++) {
            game.achievements.push({
                id: i,
                name: `Milestone Tier ${i + 1}`,
                desc: `Harvest total quanta threshold #${i + 1}.`,
                target: Math.floor(1000 * Math.pow(4.2, i)),
                unlocked: false
            });
        }

        function clickQuanta(event) {
            let gain = game.cpc * (1 + game.chips * 0.05);
            game.quanta += gain;
            game.totalEarned += gain;
            game.totalClicks++;

            // Create floating click text at click position
            if (event) {
                let floatEl = document.createElement('div');
                floatEl.className = 'click-float';
                floatEl.innerText = `+${Math.floor(gain)}`;
                floatEl.style.left = `${event.clientX - 20}px`;
                floatEl.style.top = `${event.clientY - 20}px`;
                document.body.appendChild(floatEl);
                setTimeout(() => floatEl.remove(), 800);
            }

            updateDisplay();
        }

        function buyBuilding(id) {
            let b = game.buildings[id];
            if (game.quanta >= b.cost) {
                game.quanta -= b.cost;
                b.owned++;
                b.cost = Math.floor(b.baseCost * Math.pow(1.15, b.owned));
                
                game.upgrades.forEach(u => {
                    if (u.target === id && b.owned >= (Math.floor(u.id / 50) * 5 + 1)) {
                        u.unlocked = true;
                    }
                });

                recalculateCPS();
                renderBuildings();
                renderUpgrades();
            }
        }

        function buyUpgrade(id) {
            let u = game.upgrades[id];
            if (!u.bought && game.quanta >= u.cost) {
                game.quanta -= u.cost;
                u.bought = true;
                recalculateCPS();
                renderUpgrades();
            }
        }

        function recalculateCPS() {
            let totalCPS = 0;
            game.buildings.forEach(b => {
                let buildingUpgrades = game.upgrades.filter(u => u.target === b.id && u.bought);
                let mult = 1;
                buildingUpgrades.forEach(() => mult *= 2);
                totalCPS += (b.cps * b.owned * mult);
            });
            game.cps = totalCPS * (1 + game.chips * 0.05);
        }

        function ascend() {
            let pendingChips = Math.floor(Math.sqrt(game.totalEarned / 1e15));
            if (pendingChips > 0) {
                game.chips += pendingChips;
                game.quanta = 0;
                game.totalEarned = 0;
                game.cps = 0;
                game.buildings.forEach(b => { b.owned = 0; b.cost = b.baseCost; });
                game.upgrades.forEach(u => { u.bought = false; });
                alert(`Ascended! Gained ${pendingChips} Legacy Chips.`);
                recalculateCPS();
                renderBuildings();
                renderUpgrades();
            } else {
                alert("More progress needed before ascending!");
            }
        }

        let mgActive = false;
        function triggerOverclock() {
            if (!mgActive) {
                mgActive = true;
                document.getElementById('mg-status').innerText = "OVERCLOCK SURGE ACTIVE!";
                document.getElementById('mg-btn').innerText = "Cooling...";
                game.quanta += game.cps * 90;
                setTimeout(() => {
                    mgActive = false;
                    document.getElementById('mg-status').innerText = "Core Stable";
                    document.getElementById('mg-btn').innerText = "Overclock Core";
                }, 15000);
            }
        }

        function switchTab(column, paneId) {
            let col = document.getElementById(column === 'mid' ? 'mid-col' : 'right-col');
            col.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
            col.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(paneId).classList.add('active');
            event.target.classList.add('active');
            if (paneId === 'stats-pane') renderStats();
        }

        function renderBuildings() {
            let container = document.getElementById('buildings-container');
            container.innerHTML = '';
            game.buildings.forEach(b => {
                container.innerHTML += `
                    <div class="item-card">
                        <div style="display:flex; align-items:center;">
                            <div class="item-icon">${b.icon}</div>
                            <div>
                                <strong style="color:var(--text-gold); font-size:1.05rem;">${b.name}</strong> [${b.owned}]<br>
                                <small style="color:var(--text-dim);">Cost: ${b.cost.toLocaleString()} | +${b.cps.toLocaleString()} CPS</small>
                            </div>
                        </div>
                        <button class="action-btn" onclick="buyBuilding(${b.id})">Buy</button>
                    </div>
                `;
            });
        }

        function renderUpgrades() {
            let container = document.getElementById('upgrades-container');
            container.innerHTML = '';
            let count = 0;
            for (let u of game.upgrades) {
                if (u.unlocked && !u.bought) {
                    container.innerHTML += `
                        <div class="item-card">
                            <div>
                                <strong>${u.name}</strong><br>
                                <small style="color:var(--text-dim);">Cost: ${u.cost.toLocaleString()}</small>
                            </div>
                            <button class="action-btn" onclick="buyUpgrade(${u.id})">Unlock</button>
                        </div>
                    `;
                    count++;
                    if (count > 45) break;
                }
            }
        }

        function renderAchievements() {
            let container = document.getElementById('achievements-container');
            container.innerHTML = '';
            game.achievements.forEach(a => {
                container.innerHTML += `
                    <div class="item-card" style="opacity: ${a.unlocked ? 1 : 0.4}">
                        <div>
                            <strong>${a.name}</strong><br>
                            <small style="color:var(--text-dim);">${a.desc}</small>
                        </div>
                        <div>${a.unlocked ? '🏆' : '🔒'}</div>
                    </div>
                `;
            });
        }

        function renderStats() {
            let container = document.getElementById('stats-container');
            let days = Math.floor(game.timePlayed / 86400);
            let hours = Math.floor((game.timePlayed % 86400) / 3600);
            let minutes = Math.floor((game.timePlayed % 3600) / 60);
            let seconds = Math.floor(game.timePlayed % 60);

            container.innerHTML = `
                <div class="stat-row"><span class="stat-label">Play Time:</span> <span class="stat-value">${days}d ${hours}h ${minutes}m ${seconds}s</span></div>
                <div class="stat-row"><span class="stat-label">Total Harvested:</span> <span class="stat-value">${Math.floor(game.totalEarned).toLocaleString()}</span></div>
                <div class="stat-row"><span class="stat-label">Total Clicks:</span> <span class="stat-value">${game.totalClicks.toLocaleString()}</span></div>
                <div class="stat-row"><span class="stat-label">Current CPS:</span> <span class="stat-value">${game.cps.toLocaleString()}</span></div>
                <div class="stat-row"><span class="stat-label">Legacy Chips:</span> <span class="stat-value">${game.chips.toLocaleString()}</span></div>
            `;
        }

        // Game Loop
        setInterval(() => {
            game.quanta += (game.cps / 20);
            game.totalEarned += (game.cps / 20);
            game.timePlayed += 0.05;

            game.achievements.forEach(a => {
                if (!a.unlocked && game.totalEarned >= a.target) {
                    a.unlocked = true;
                    renderAchievements();
                }
            });

            updateDisplay();
        }, 50);

        function updateDisplay() {
            document.getElementById('quanta-display').innerText = Math.floor(game.quanta).toLocaleString();
            document.getElementById('cps-display').innerText = `per second: ${game.cps.toFixed(1)}`;
            document.getElementById('chips-display').innerText = game.chips;
            document.getElementById('chips-pending').innerText = Math.floor(Math.sqrt(game.totalEarned / 1e15));
        }

        // Init
        renderBuildings();
        renderUpgrades();
        renderAchievements();
    </script>
</body>
</html>
